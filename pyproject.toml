[project]
name = "oncora-nexus"
version = "1.0.0"
description = "Evidence grounded decision support for breast cancer multidisciplinary teams: hybrid RAG with a local LLM, prognostic and subtype models, and criterion level trial screening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "scikit-survival>=0.23",
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "py7zr>=0.21",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
neural = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
include = ["oncora*"]

[tool.setuptools.package-data]
oncora = ["data/knowledge_cards.json", "models/therapy_rules.json", "eval/clinical_questions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]
